# Packaging for Vigil at Home. Releases are unsigned (ad hoc) until Apple
# signing keys are added to the repo secrets; see .github/workflows/release.yml.
appId: app.vigilathome.desktop
productName: Vigil at Home
copyright: Copyright © Vigil at Home contributors
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
  # Tray icons, loaded from out/main through `?asset` imports (../../resources/...).
  - resources/tray*.png
asar: true
mac:
  category: public.app-category.utilities
  icon: resources/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # One name pattern for both chips: ...-arm64.dmg (Apple silicon), ...-x64.dmg (Intel).
  artifactName: Vigil-at-Home-${version}-${arch}.${ext}
  hardenedRuntime: true
  # The Vigil helper, installed as root through the macOS password dialog. Built by
  # scripts/build-helper.mjs: the bundled helper plus Node.js for this chip.
  extraResources:
    - from: build/helper/common
      to: helper
    - from: build/helper/darwin-${arch}
      to: helper
      filter: [node]
  # Keep Node.js's own Developer ID signature and notarization on the helper runtime.
  signIgnore:
    - Resources/helper/node$
  extendInfo:
    # Menu-bar app: no Dock icon until the main window opens.
    LSUIElement: true
dmg:
  title: Vigil at Home
# Linux is only used to smoke-test packaging in CI; macOS is the product.
linux:
  target: dir
  executableName: vigil-at-home
