# Packaging for Vigil at Home. Releases are unsigned (ad hoc) until Apple
# signing keys are added to the repo secrets; see .github/workflows/release.yml.
appId: app.vigilathome.desktop
productName: Vigil at Home
copyright: Copyright © Vigil at Home contributors
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
  # Tray icons, loaded from out/main through `?asset` imports (../../resources/...).
  - resources/tray*.png
asar: true
# Turns off Electron's run-as-Node, NODE_OPTIONS and --inspect in the packaged app.
afterPack: scripts/fuses.mjs
mac:
  category: public.app-category.utilities
  icon: resources/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # One name pattern for both chips: ...-arm64.dmg (Apple silicon), ...-x64.dmg (Intel).
  artifactName: Vigil-at-Home-${version}-${arch}.${ext}
  hardenedRuntime: true
  # The Vigil helper, installed as root through the macOS password dialog. Built by
  # scripts/build-helper.mjs: the bundled helper plus Node.js for this chip.
  extraResources:
    - from: build/helper/common
      to: helper
      # The systemd unit and polkit policy are for Linux builds only.
      filter: ['**/*', '!linux/**']
    - from: build/helper/darwin-${arch}
      to: helper
      filter: [node, NODE-LICENSE]
    # License notices for the code and fonts bundled into out/ (NOTICE lists them).
    # build/licenses holds the full texts of the npm packages bundled into out/
    # and the helper (scripts/third-party-licenses.mjs).
    - from: build/licenses
      to: licenses
    # electron-builder drops Electron's and Chromium's licenses from mac builds
    # (Linux keeps them); build-helper.mjs copies them here.
    - from: build/electron-licenses/LICENSE.electron.txt
      to: LICENSE.electron.txt
    - from: build/electron-licenses/LICENSES.chromium.html
      to: LICENSES.chromium.html
    - from: ../../LICENSE
      to: LICENSE
    - from: ../../NOTICE
      to: NOTICE
    - from: ../../THIRD_PARTY_NOTICES.md
      to: THIRD_PARTY_NOTICES.md
  # Keep Node.js's own Developer ID signature and notarization on the helper runtime.
  signIgnore:
    - Resources/helper/node$
  extendInfo:
    # Menu-bar app: no Dock icon until the main window opens.
    LSUIElement: true
dmg:
  title: Vigil at Home
# Linux: a .deb for Debian and Ubuntu, and an AppImage for everything else.
# Setup installs the helper through polkit, so neither package runs anything
# as root on its own.
linux:
  target:
    - target: deb
      arch: [x64]
    - target: AppImage
      arch: [x64]
  executableName: vigil-at-home
  maintainer: Vigil at Home contributors (https://github.com/ShmalexM/Vigil-at-Home/issues)
  icon: resources/icon.png
  category: System
  synopsis: Your own security monitor for this computer
  description: Vigil at Home watches this computer for malicious activity and blocks it.
  artifactName: Vigil-at-Home-${version}-${arch}.${ext}
  # XWayland, so the popover and popup can be placed and kept on top (display.ts).
  executableArgs: ['--ozone-platform=x11']
  desktop:
    entry:
      Keywords: security;antivirus;firewall;monitor;
  # The helper, its systemd unit and polkit policy, and Node.js for this chip.
  extraResources:
    - from: build/helper/common
      to: helper
      # Leave out the macOS launchd job and scripts; Linux uses helper/linux/,
      # which shares lib.sh with them.
      filter:
        ['**/*', '!com.vigilathome.helper.plist', '!install.sh', '!uninstall.sh', '!vigil-helper']
    - from: build/helper/linux-${arch}
      to: helper
      filter: [node, NODE-LICENSE]
    - from: build/licenses
      to: licenses
    - from: ../../LICENSE
      to: LICENSE
    - from: ../../NOTICE
      to: NOTICE
    - from: ../../THIRD_PARTY_NOTICES.md
      to: THIRD_PARTY_NOTICES.md
deb:
  # pkexec shows the password dialog for setup and for every release or allow.
  depends:
    [
      'pkexec | policykit-1',
      'libnotify4',
      'libnss3',
      'libxss1',
      'libxtst6',
      'xdg-utils',
      'libatspi2.0-0',
      'libuuid1',
      'libsecret-1-0',
    ]
