<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Vigil at Home app icon">
  <title>Vigil at Home app icon</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2440"/>
      <stop offset="1" stop-color="#0B0F19"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3D82FF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#3D82FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4B9DFF"/>
      <stop offset="1" stop-color="#1D4FC4"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD45A"/>
      <stop offset="1" stop-color="#FF8A2A"/>
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- macOS icon grid: an 824 px tile on a 1024 px canvas. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#tileShadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>
  <circle cx="512" cy="500" r="340" fill="url(#glow)"/>
  <g filter="url(#markShadow)">
    <g transform="translate(258 207.2) scale(12.7)">
      <path d="M7 2H33Q38 2 38 7V22C38 33 30.5 41 20 46C9.5 41 2 33 2 22V7Q2 2 7 2Z" fill="url(#body)"/>
      <path d="M20.5 8.5C22 13.5 27.8 17 27.8 24.6C27.8 29.6 24.2 33.6 20 33.6C15.8 33.6 12.2 29.6 12.2 25C12.2 21.4 14 18.8 16 17.2C16 19.8 17 21.7 18.7 22.6C18 17.8 18.6 12.3 20.5 8.5Z" fill="url(#flame)"/>
      <path d="M20.2 20.6C22 23 23.8 24.8 23.8 27.6C23.8 29.9 22.1 31.4 20 31.4C17.9 31.4 16.2 29.9 16.2 27.8C16.2 25.4 18.4 23.4 20.2 20.6Z" fill="#FFF4CF"/>
