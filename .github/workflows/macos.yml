name: macOS checks

# Checks that need real macOS, on GitHub's hosted Mac runners. Each area owns
# one job, so a failure points at the right package:
#   test      full test suite on macOS                  (repo)
#   app       launches the app and checks the popup     (apps/desktop)
#   sensors   pf, osquery and Santa checks              (packages/sensors, packages/helper)
#   ai-live   live escape tests against a local model   (packages/ai)
# Add a job here rather than a new workflow. Screenshots and logs go to the
# run's artifacts.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm check

  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vigil/desktop build
      - name: Check the detection popup
        working-directory: apps/desktop
        run: node e2e/popup.e2e.mjs e2e-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-popup-screenshots
          path: apps/desktop/e2e-results
