name: Release

# Builds the Mac app for Apple silicon and Intel, and the Linux app as a .deb
# and an AppImage. Running it by hand with a version creates a draft GitHub
# release with them attached; a maintainer publishes it. It does not run on tag
# pushes: publishing a draft creates its tag, and a tag trigger would build again
# and leave a second draft. Versions with a hyphen
# (0.1.0-alpha.1) are marked as pre-releases. Running it by hand without a
# version only uploads the build as a workflow artifact.
#
# Signing is optional. With no Apple secrets the app is ad hoc signed: it runs,
# but macOS asks the user to approve it once in System Settings > Privacy &
# Security. To sign and notarize, add these repository secrets:
#   CSC_LINK, CSC_KEY_PASSWORD        Developer ID Application certificate (.p12, base64) and password
#   APPLE_API_KEY                     App Store Connect API key (.p8 contents)
#   APPLE_API_KEY_ID, APPLE_API_ISSUER

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like 0.1.0 or 0.1.0-alpha.1 (leave empty to only build)
        required: false
  # Also check packaging whenever the packaging setup changes.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - apps/desktop/electron-builder.yml
      - apps/desktop/package.json
      - apps/desktop/helper/**
      - apps/desktop/scripts/build-helper.mjs

# Read-only by default: pull requests build here too. Only the release job,
# which drafts the GitHub release, can write.
permissions:
  contents: read

# Hosted Mac runners are scarce, so a newer push to the same pull request
# replaces the older build. Hand-started builds always finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Pick the release version
        id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          v="${INPUT#v}"
          if [[ -n "$v" && ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Not a version: $v" >&2; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Set the app version
        if: steps.version.outputs.version != ''
        working-directory: apps/desktop
        run: npm pkg set version="${{ steps.version.outputs.version }}"

      - name: Build and package
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          pnpm build
          pnpm build:helper
          if [[ -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" && -n "$APPLE_API_KEY_CONTENT" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]]; then
            echo "Signing with Developer ID and notarizing."
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
            pnpm exec electron-builder --mac --publish never -c.mac.notarize=true
          else
            echo "No Apple signing secrets: building an ad hoc signed app."
            unset CSC_LINK CSC_KEY_PASSWORD
            CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder --mac --publish never \
              -c.mac.identity=- -c.mac.notarize=false
          fi

      - name: Check both apps carry the helper
        working-directory: apps/desktop/dist
        run: |
          for app in mac-arm64/*.app mac/*.app; do
            h="$app/Contents/Resources/helper"
            for f in node helper.mjs install.sh uninstall.sh vigil-helper com.vigilathome.helper.plist; do
              test -f "$h/$f" || { echo "Missing $h/$f"; exit 1; }
            done
            echo "$app: helper runtime $(lipo -archs "$h/node")"
            # electron-builder must leave Node.js's own signature in place
            # (HX7739G8FX is the Node.js Foundation's Apple team).
            codesign --verify --strict "$h/node"
            codesign -dv "$h/node" 2>&1 | grep -q '^TeamIdentifier=HX7739G8FX$' \
              || { codesign -dv "$h/node"; exit 1; }
          done
          h="mac-arm64/Vigil at Home.app/Contents/Resources/helper"
          "$h/node" "$h/helper.mjs" santa-profile | grep -q PayloadContent

      # A menu-bar app that fails at startup shows nothing, so launch the packaged
      # app and check it is still running without errors (alpha.2 lost its tray icon).
      - name: Check the packaged app starts
        working-directory: apps/desktop/dist
        run: |
          log="$RUNNER_TEMP/launch.log"
          "mac-arm64/Vigil at Home.app/Contents/MacOS/Vigil at Home" > "$log" 2>&1 &
          pid=$!
          sleep 30
          alive=yes; kill -0 "$pid" 2>/dev/null || alive=no
          kill "$pid" 2>/dev/null || true
          cat "$log"
          test "$alive" = yes || { echo "The app quit during startup"; exit 1; }
          if grep -Eq 'could not start|UnhandledPromiseRejection|Failed to load image' "$log"; then
            echo "The app reported a startup error"; exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: vigil-at-home-mac
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Set the app version
        env:
          INPUT: ${{ inputs.version }}
        working-directory: apps/desktop
        run: |
          v="${INPUT#v}"
          if [[ -n "$v" ]]; then npm pkg set version="$v"; fi

      - name: Build and package
        working-directory: apps/desktop
        run: |
          pnpm build
          node scripts/build-helper.mjs --os linux --arch x64
          pnpm exec electron-builder --linux --publish never

      - name: Check the package carries the helper
        working-directory: apps/desktop/dist
        run: |
          h=linux-unpacked/resources/helper
          for f in node helper.mjs linux/install.sh linux/uninstall.sh linux/vigil-helper \
            linux/vigil-helper.service linux/com.vigilathome.helper.policy; do
            test -f "$h/$f" || { echo "Missing $h/$f"; exit 1; }
          done
          file "$h/node" | grep -q 'x86-64' || { file "$h/node"; exit 1; }

      # Install the .deb as a user would, set up the helper from the installed
      # copy, and check the app starts and stays running.
      - name: Install the .deb and its helper
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb ./apps/desktop/dist/*.deb
          sudo sh "/opt/Vigil at Home/resources/helper/linux/install.sh"
          systemctl is-active vigil-helper
          test -S /run/vigil-helper.sock

      - name: Check the installed app starts
        run: |
          log="$RUNNER_TEMP/launch.log"
          xvfb-run -a vigil-at-home > "$log" 2>&1 &
          pid=$!
          sleep 30
          alive=yes; kill -0 "$pid" 2>/dev/null || alive=no
          kill "$pid" 2>/dev/null || true
          cat "$log"
          test "$alive" = yes || { echo "The app quit during startup"; exit 1; }
          if grep -Eq 'could not start|UnhandledPromiseRejection|Failed to load image' "$log"; then
            echo "The app reported a startup error"; exit 1
          fi

      - name: Remove the helper
        if: always()
        run: sudo sh "/opt/Vigil at Home/resources/helper/linux/uninstall.sh" || true

      - uses: actions/upload-artifact@v7
        with:
          name: vigil-at-home-linux
          path: |
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.AppImage

  release:
    needs: [mac, linux]
    if: needs.mac.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Draft a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.mac.outputs.version }}
        run: |
          # One release per version: a draft or published release with this tag
          # already exists, so leave it for the maintainer instead of adding another.
          if gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' | grep -Fxq "v$VERSION"; then
            echo "::notice::A release for v$VERSION already exists, so no new draft was made."
            exit 0
          fi
          (cd dist && sha256sum *.dmg *.zip *.deb *.AppImage > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          flags=(--draft --target "$GITHUB_SHA" --title "Vigil at Home $VERSION" --notes-file .github/release-notes.md)
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          gh release create "v$VERSION" "${flags[@]}" dist/*.dmg dist/*.zip dist/*.deb dist/*.AppImage \
            dist/SHA256SUMS.txt
