name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm check:naming
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          # No Claude or Codex logins here, so the real-CLI plan usage test is safe to run.
          VIGIL_TEST_REAL_CLI_USAGE: '1'
      - run: pnpm --filter @vigil/desktop build
