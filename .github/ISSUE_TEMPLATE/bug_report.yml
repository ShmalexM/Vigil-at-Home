name: Bug report
description: Something in Vigil at Home doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a security hole? Please don't file it here. Use **Report a vulnerability** on the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Vigil from the menu bar
        2. ...
  - type: input
    id: version
    attributes:
      label: Vigil version
      description: Settings › About, or the DMG name.
      placeholder: 0.1.0-alpha.2
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Mac
      options:
        - Apple silicon
        - Intel
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: '15.6'
    validations:
      required: true
  - type: dropdown
    id: helper
    attributes:
      label: Is the Vigil helper installed?
      description: Home › Protection says whether blocking is real or simulated.
      options:
        - 'Yes'
        - 'No'
        - Not sure
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Anything relevant from /Library/Logs/Vigil/helper.log. Check it for paths or names you'd rather not share before pasting.
      render: text
